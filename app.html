<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI FIT CENTER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
    <style>
        /* Styles: AppShell */
        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .app-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 70px;
        }
        .app-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        /* Styles: BottomNav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0,0,0,0.08);
            padding: 8px 4px;
            z-index: 1000;
            height: 64px;
        }
        .nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 2px;
            border-radius: 10px;
            transition: all 0.2s;
            font-family: inherit;
            color: #6b7280;
            font-size: 11px;
            font-weight: 500;
        }
        .nav-btn.active {
            color: #3b82f6;
        }
        .nav-btn svg {
            width: 22px;
            height: 22px;
        }
        .nav-btn.active svg path,
        .nav-btn.active svg rect,
        .nav-btn.active svg circle {
            stroke: #3b82f6;
        }
    </style>
</head>
<body>
    <!-- Block: AppShell -->
    <div class="app-shell">
        <!-- Block: ContentArea -->
        <div class="app-content" id="appContent">
            <iframe id="pageFrame" class="app-iframe" src="pages/home.html" title="Content"></iframe>
        </div>

        <!-- Block: BottomNavigation -->
        <nav class="bottom-nav" id="bottomNav">
            <!-- Главная -->
            <button class="nav-btn active" data-page="pages/home.html" data-tab="home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Главная
            </button>
            <!-- Модули -->
            <button class="nav-btn" data-page="pages/modules.html" data-tab="modules">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                Модули
            </button>
            <!-- Партнерка -->
            <button class="nav-btn" data-page="pages/partner.html" data-tab="partner">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                Партнерка
            </button>
            <!-- Оплата -->
            <button class="nav-btn" data-page="pages/payment.html" data-tab="payment">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                Оплата
            </button>
            <!-- Настройки -->
            <button class="nav-btn" data-page="pages/settings.html" data-tab="settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                Настройки
            </button>
            v>
    </div>

    <!-- Block: NavigationLogic -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const frame = document.getElementById('pageFrame');
        const navBtns = document.querySelectorAll('.nav-btn');

        // THEME COLORS - текущая активная вкладка
        let currentTab = 'home';

        function navigate(page, tab) {
            frame.src = page;
            currentTab = tab;
            navBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });
            tg.HapticFeedback.selectionChanged();
        }

        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                navigate(btn.dataset.page, btn.dataset.tab);
            });
        });

        // Block: CrossFrameNavigation
        // Принимаем сообщения из iframe (например, переход в модуль Агент)
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'navigate') {
                navigate(e.data.page, e.data.tab || currentTab);
            }
        });
    </script>
</body>
</html>
