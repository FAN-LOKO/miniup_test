<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI FIT CENTER — Главная</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="config/themeConfig.js"></script>
</head>
<body>
    <!-- Block: AppRoot -->
    <div class="app">
        <div class="screen1">
            <h1>Главная</h1>

            <!-- Block: AuthStatus -->
            <div class="card">
                <div class="card__row">
                    <span class="card__label">Статус авторизации</span>
                    <span class="card__value card__value--success" id="authStatus">Авторизован</span>
                </div>
            </div>

            <!-- Block: UserCard -->
            <div class="card">
                <div class="card__header">Данные пользователя</div>
                <div class="card__body card__body--centered">
                    <img id="userAvatar" class="user-avatar" src="" alt="Аватар" />
                    <p class="user-name" id="userName">@username</p>
                </div>
            </div>

            <!-- Block: SubscriptionCard -->
            <div class="card">
                <div class="card__header">Подписка</div>
                <div class="card__body">
                    <div class="card__row">
                        <span class="card__label">Статус подписки</span>
                        <span class="card__value card__value--success" id="subscriptionStatus">Активна</span>
                    </div>
                    <div class="card__row">
                        <span class="card__label">Осталось дней</span>
                        <span class="card__value" id="daysLeft">30</span>
                    </div>
                    <button class="pay-button" id="payButton">Оплатить</button>
                </div>
            </div>

            <!-- Block: ScreenNavigation -->
            <nav class="screen-nav">
                <a href="screen-1.html" class="screen-nav__button screen-nav__button--active">Главная</a>
                <a href="screen-2.html" class="screen-nav__button">Бот</a>
                <a href="screen-3.html" class="screen-nav__button">Ссылки</a>
                <a href="screen-4.html" class="screen-nav__button">Профиль</a>
                <a href="screen-5.html" class="screen-nav__button">Статистика</a>
            </nav>
        </div>
    </div>

    <style>
        /* Styles: ScreenLayout */
        .screen1 { padding: 16px; padding-bottom: 100px; }
        .screen1 h1 { font-size: 22px; font-weight: 700; color: #0b3c78; margin-bottom: 16px; padding-left: 4px; }

        /* Styles: Card */
        .card { background: #ffffff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; overflow: hidden; }
        .card__header { background: #4A90E2; color: #ffffff; font-size: 15px; font-weight: 600; padding: 12px 16px; }
        .card__body { padding: 16px; }
        .card__body--centered { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .card__row { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid #f3f4f6; }
        .card__row:last-child { border-bottom: none; }
        .card__label { font-size: 14px; color: #6b7280; }
        .card__value { font-size: 14px; font-weight: 600; color: #1f2937; }
        .card__value--success { color: #10b981; }

        /* Styles: UserAvatar */
        .user-avatar { width: 64px; height: 64px; border-radius: 50%; background: #e5e7eb; border: 2px solid #ffffff; }
        .user-name { font-size: 16px; font-weight: 600; color: #111827; }

        /* Styles: PayButton */
        .pay-button { width: 100%; margin-top: 12px; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram.WebApp;
            tg.ready();
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('userName').textContent = `@${user.username || user.first_name}`;
                if (user.photo_url) {
                    document.getElementById('userAvatar').src = user.photo_url;
                }
            }
        });
    </script>

        <!-- Block: ScreenNavigation -->
    <nav class="screen-nav">
        <a href="screen-1.html" class="screen-nav__button screen-nav__button--active">Главная</a>
        <a href="screen-2.html" class="screen-nav__button">Бот</a>
        <a href="screen-3.html" class="screen-nav__button">Ссылки</a>
        <a href="screen-4.html" class="screen-nav__button">Агент</a>
        <a href="screen-5.html" class="screen-nav__button">Статистика</a>
    </nav>
</body>
</html>
