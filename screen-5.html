<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI FIT CENTER — Статистика</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="config/themeConfig.js"></script>
</head>
<body>
    <div class="app">
        <div class="screen-content">
            <!-- Block: StatisticsHeader -->
            <h1 id="screenTitle">Статистика</h1>

            <!-- Block: StatisticsSummary -->
            <div class="stats-grid">
                <div class="stats-card">
                    <span class="stats-label">Диалоги</span>
                    <span class="stats-value" id="totalDialogs">12</span>
                </div>
                <div class="stats-card">
                    <span class="stats-label">Реф. ссылки</span>
                    <span class="stats-value" id="refLinksSent">5</span>
                </div>
            </div>

            <!-- Block: DetailedStats (Accordion) -->
            <div class="section-title">Детализация</div>

            <!-- Item: Dialogs -->
            <div class="card accordion">
                <button class="accordion__header" id="toggleDialogs">
                    Список диалогов
                    <span class="accordion__icon">▼</span>
                </button>
                <div class="accordion__content" id="contentDialogs">
                    <div class="dialog-list" id="dialogList">
                        <div class="dialog-item">
                            <div class="dialog-info">
                                <span class="dialog-user">Клиент: @user1</span>
                                <span class="dialog-date">18.03.2026</span>
                            </div>
                            <p class="dialog-last-msg">Последнее сообщение: "Спасибо за инфо!"</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Item: RefLinks -->
            <div class="card accordion">
                <button class="accordion__header" id="toggleRefs">
                    Выданные ссылки
                    <span class="accordion__icon">▼</span>
                </button>
                <div class="accordion__content" id="contentRefs">
                    <div class="ref-list" id="refList">
                        <div class="ref-item">
                            <span>@user1 — Клиентская ссылка</span>
                            <span class="ref-date">10:45</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Block: ScreenNavigation -->
        <nav class="screen-nav">
            <a href="screen-1.html" class="screen-nav__button">Главная</a>
            <a href="screen-2.html" class="screen-nav__button">Бот</a>
            <a href="screen-3.html" class="screen-nav__button">Ссылки</a>
            <a href="screen-4.html" class="screen-nav__button">Профиль</a>
            <a href="screen-5.html" class="screen-nav__button screen-nav__button--active">Статистика</a>
        </nav>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram.WebApp;
            tg.ready();

            // Accordion Logic
            function initAccordion(headerId, contentId) {
                const header = document.getElementById(headerId);
                const content = document.getElementById(contentId);
                header.addEventListener('click', () => {
                    const isOpen = content.classList.toggle('active');
                    header.classList.toggle('open', isOpen);
                });
            }
            initAccordion('toggleDialogs', 'contentDialogs');
            initAccordion('toggleRefs', 'contentRefs');
        });
    </script>
</body>
</html>
