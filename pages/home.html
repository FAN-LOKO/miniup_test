<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="page">
    <!-- Profile Block -->
    <div class="profile-card">
        <div class="avatar">👤</div>
        <div class="profile-info">
            <div class="profile-name" id="userName">Имя пользователя</div>
            <div class="profile-status" id="userStatus">Не авторизован</div>
        </div>
    </div>

    <!-- Modules Section -->
    <p class="section-title">Мои модули</p>

    <!-- Agent Module Card -->
    <div class="module-card">
        <div class="module-header">
            <div class="module-header-left">
                <span class="module-icon">🤖</span>
                <span class="module-name">Агент</span>
            </div>
            <span class="badge" id="agentBadge">30 дней</span>
        </div>
        <div class="module-body">
            <p>Искусственный агент для вашего бизнеса</p>
            <button class="btn-open" onclick="openModule('agent')">
                Открыть модуль
            </button>
        </div>
    </div>
</div><!-- .page -->

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    // Show user info
    const user = tg.initDataUnsafe.user;
    if (user) {
        document.getElementById('userName').textContent =
            user.first_name + ' ' + (user.last_name || '');
        document.getElementById('userStatus').textContent =
            '@' + (user.username || 'Авторизован');
    }

    // Open module - send message to parent (app.html)
    function openModule(module) {
        window.parent.postMessage(
            { type: 'navigate', page: module + '/index.html', tab: 'home' },
            '*'
        );
    }
</script>
</body>
</html>
