<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Модули</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="page">

  <h1 class="page-title">Модули</h1>

  <!-- Agent -->
  <div class="module-card">
    <div class="module-header">
      <div class="module-header-left">
        <span class="module-icon">🤖</span>
        <span class="module-name">Агент</span>
      </div>
      <span class="badge">Активен</span>
    </div>
    <div class="module-body">
      <p>Искусственный агент для вашего бизнеса</p>
      <button class="btn-open"
        onclick="openModule('agent')">
        Открыть
      </button>
    </div>
  </div>

  <!-- Module 2: Coming soon -->
  <div class="module-card">
    <div class="module-header">
      <div class="module-header-left">
        <span class="module-icon">📊</span>
        <span class="module-name">Аналитика</span>
      </div>
      <span class="badge soon">Скоро</span>
    </div>
    <div class="module-body">
      <p>Аналитика и отчётность по модулю Агент</p>
      <button class="btn-open btn-soon" disabled>
        Скоро
      </button>
    </div>
  </div>

</div><!-- .page -->

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();

  function openModule(module) {
    window.parent.postMessage(
      { type: 'navigate',
        page: module + '/index.html',
        tab: 'modules' },
      '*'
    );
  }
</script>
</body>
</html>
