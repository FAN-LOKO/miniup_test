<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Модули</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, sans-serif;
      background: #f5f5f5;
    }
    .page { padding: 16px; }
    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: #1a3a5c;
      margin-bottom: 16px;
    }
    .module-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .module-header {
      background: #1a3a5c;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .module-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .module-icon { font-size: 20px; }
    .module-name { font-size: 15px; font-weight: 600; }
    .badge {
      background: #f0a500;
      color: white;
      border-radius: 12px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge.inactive { background: #aaa; }
    .badge.soon { background: #3a7bd5; }
    .module-body {
      padding: 14px 16px;
      font-size: 14px;
      color: #555;
    }
    .btn-open {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: #1a3a5c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-soon {
      background: #ccc;
      cursor: default;
    }
  </style>
</head>
<body>
<div class="page">

  <h1 class="page-title">Модули</h1>

  <!-- Agent -->
  <div class="module-card">
    <div class="module-header">
      <div class="module-header-left">
        <span class="module-icon">🤖</span>
        <span class="module-name">Агент</span>
      </div>
      <span class="badge">Активен</span>
    </div>
    <div class="module-body">
      <p>Искусственный агент для вашего бизнеса</p>
      <button class="btn-open"
        onclick="openModule('agent')">
        Открыть
      </button>
    </div>
  </div>

  <!-- Module 2: Coming soon -->
  <div class="module-card">
    <div class="module-header">
      <div class="module-header-left">
        <span class="module-icon">📊</span>
        <span class="module-name">Аналитика</span>
      </div>
      <span class="badge soon">Скоро</span>
    </div>
    <div class="module-body">
      <p>Аналитика и отчётность по модулю Агент</p>
      <button class="btn-open btn-soon" disabled>
        Скоро
      </button>
    </div>
  </div>

</div><!-- .page -->

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();

  function openModule(module) {
    window.parent.postMessage(
      { type: 'navigate',
        page: module + '/index.html',
        tab: 'modules' },
      '*'
    );
  }
</script>
</body>
</html>
