<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Оплата</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, sans-serif;
      background: #f5f5f5;
    }
    .page { padding: 16px; }
    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: #1a3a5c;
      margin-bottom: 16px;
    }
    .balance-card {
      background: #1a3a5c;
      color: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      text-align: center;
    }
    .balance-label {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 8px;
    }
    .balance-amount {
      font-size: 36px;
      font-weight: 700;
    }
    .balance-currency {
      font-size: 18px;
      opacity: 0.8;
    }
    .plan-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .plan-header {
      background: #1a3a5c;
      color: white;
      padding: 14px 16px;
      font-weight: 600;
    }
    .plan-body {
      padding: 14px 16px;
      font-size: 14px;
      color: #333;
    }
    .plan-price {
      font-size: 22px;
      font-weight: 700;
      color: #1a3a5c;
      margin-bottom: 8px;
    }
    .plan-days {
      color: #888;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .btn-pay {
      display: block;
      width: 100%;
      padding: 12px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="page">

  <h1 class="page-title">Оплата</h1>

  <!-- Balance -->
  <div class="balance-card">
    <div class="balance-label">Баланс</div>
    <div>
      <span class="balance-amount" id="balance">0</span>
      <span class="balance-currency"> руб.</span>
    </div>
  </div>

  <!-- Plan 1 month -->
  <div class="plan-card">
    <div class="plan-header">📅 Модуль Агент</div>
    <div class="plan-body">
      <div class="plan-price">990 руб.</div>
      <div class="plan-days">30 дней</div>
      <button class="btn-pay"
        onclick="pay(990, 30)">
        Оплатить
      </button>
    </div>
  </div>

  <!-- Plan 3 months -->
  <div class="plan-card">
    <div class="plan-header">📅 Модуль Агент — 3 мес.</div>
    <div class="plan-body">
      <div class="plan-price">2490 руб.</div>
      <div class="plan-days">90 дней (скидка 16%)</div>
      <button class="btn-pay"
        onclick="pay(2490, 90)">
        Оплатить
      </button>
    </div>
  </div>

</div><!-- .page -->

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();

  function pay(amount, days) {
    tg.showAlert(
      'Оплата ' + amount + ' руб. на '
      + days + ' дней - будет добавлена позже'
    );
  }
</script>
</body>
</html>
