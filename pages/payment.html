<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Оплата</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body><div class="page">

  <h1 class="page-title">Оплата</h1>

  <!-- Balance -->
  <div class="balance-card">
    <div class="balance-label">Баланс</div>
    <div>
      <span class="balance-amount" id="balance">0</span>
      <span class="balance-currency"> руб.</span>
    </div>
  </div>

  <!-- Plan 1 month -->
  <div class="plan-card">
    <div class="plan-header">📅 Модуль Агент</div>
    <div class="plan-body">
      <div class="plan-price">990 руб.</div>
      <div class="plan-days">30 дней</div>
      <button class="btn-pay"
        onclick="pay(990, 30)">
        Оплатить
      </button>
    </div>
  </div>

  <!-- Plan 3 months -->
  <div class="plan-card">
    <div class="plan-header">📅 Модуль Агент — 3 мес.</div>
    <div class="plan-body">
      <div class="plan-price">2490 руб.</div>
      <div class="plan-days">90 дней (скидка 16%)</div>
      <button class="btn-pay"
        onclick="pay(2490, 90)">
        Оплатить
      </button>
    </div>
  </div>

</div><!-- .page -->

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();

  function pay(amount, days) {
    tg.showAlert(
      'Оплата ' + amount + ' руб. на '
      + days + ' дней - будет добавлена позже'
    );
  }
</script>
</body>
</html>
