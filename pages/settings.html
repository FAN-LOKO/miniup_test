<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Настройки</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, sans-serif;
      background: #f5f5f5;
    }
    .page { padding: 16px; }
    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: #1a3a5c;
      margin-bottom: 16px;
    }
    .settings-section {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .settings-header {
      background: #1a3a5c;
      color: white;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
    }
    .settings-item {
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .settings-item:last-child {
      border-bottom: none;
    }
    .settings-label {
      font-size: 14px;
      color: #333;
    }
    .settings-value {
      font-size: 14px;
      color: #888;
    }
    .btn-logout {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="page">

  <h1 class="page-title">Настройки</h1>

  <!-- Profile -->
  <div class="settings-section">
    <div class="settings-header">👤 Профиль</div>
    <div class="settings-item">
      <span class="settings-label">Имя</span>
      <span class="settings-value" id="sName">-</span>
    </div>
    <div class="settings-item">
      <span class="settings-label">Username</span>
      <span class="settings-value" id="sUser">-</span>
    </div>
    <div class="settings-item">
      <span class="settings-label">ID</span>
      <span class="settings-value" id="sId">-</span>
    </div>
  </div>

  <!-- App -->
  <div class="settings-section">
    <div class="settings-header">ℹ️ О приложении</div>
    <div class="settings-item">
      <span class="settings-label">Версия</span>
      <span class="settings-value">1.0.0</span>
    </div>
    <div class="settings-item">
      <span class="settings-label">Разработчик</span>
      <span class="settings-value">KadtsinDigital</span>
    </div>
  </div>

  <button class="btn-logout"
    onclick="tg.close()">
    Закрыть приложение
  </button>

</div><!-- .page -->

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();

  const user = tg.initDataUnsafe.user;
  if (user) {
    document.getElementById('sName').textContent =
      user.first_name + ' ' + (user.last_name || '');
    document.getElementById('sUser').textContent =
      '@' + (user.username || '-');
    document.getElementById('sId').textContent =
      user.id;
  }
</script>
</body>
</html>
