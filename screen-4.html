<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI FIT CENTER — Профиль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="config/themeConfig.js"></script>
</head>
<body>
    <!-- Block: AppRoot -->
    <div class="app">
        <div class="screen-content">
            <!-- Block: AgentProfileTitle -->
            <h1 id="screenTitle">Профиль агента</h1>

            <!-- Block: AgentInfoCard -->
            <div class="card">
                <div class="agent-card-header">
                    <div class="agent-avatar-placeholder" id="avatarPlaceholder">
                        <span id="initials">AI</span>
                    </div>
                    <div class="agent-names">
                        <h2 id="agentFullName">Имя Фамилия</h2>
                        <span class="badge" id="agentRole">Агент</span>
                    </div>
                </div>
            </div>

            <!-- Block: AgentManagement -->
            <div class="section-title">Управление</div>
            <div class="card">
                <div class="form-group">
                    <label class="form-label">Язык интерфейса</label>
                    <select class="form-input" id="languageSelect">
                        <option value="ru">Русский</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <div class="form-group">
                    <button class="action-button" id="sendTestMsg">Отправить тестовое сообщение</button>
                </div>
            </div>
        </div>

        <!-- Block: ScreenNavigation -->
        <nav class="screen-nav">
            <a href="screen-1.html" class="screen-nav__button">Главная</a>
            <a href="screen-2.html" class="screen-nav__button">Бот</a>
            <a href="screen-3.html" class="screen-nav__button">Ссылки</a>
            <a href="screen-4.html" class="screen-nav__button screen-nav__button--active">Профиль</a>
            <a href="screen-5.html" class="screen-nav__button">Статистика</a>
        </nav>
    </div>

    <script>
        // THEME COLORS & CONFIG
        document.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();

            // Применяем тему из конфига
            const avatarBg = themeConfig.screen1.avatarPlaceholderBg;
            const avatarColor = themeConfig.screen1.avatarPlaceholderText;
            const avatarEl = document.getElementById('avatarPlaceholder');
            avatarEl.style.backgroundColor = avatarBg;
            avatarEl.style.color = avatarColor;

            // Заполнение данных (имитация)
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('agentFullName').textContent = `${user.first_name} ${user.last_name || ''}`;
                const initials = (user.first_name[0] + (user.last_name ? user.last_name[0] : '')).toUpperCase();
                document.getElementById('initials').textContent = initials;
            }

            document.getElementById('sendTestMsg').addEventListener('click', () => {
                tg.HapticFeedback.impactOccurred('medium');
                tg.showPopup({ message: 'Тестовое сообщение отправлено боту!' });
            });
        });
    </script>
</body>
</html>
